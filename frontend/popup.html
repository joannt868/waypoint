<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Waypoint</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <header>
        <div class="brand">
            <div class="brand-mark">W</div>
            <div>
                <div class="brand-name">Waypoint</div>
                <div class="brand-subtitle">Your path through the web</div>
            </div>
        </div>

        <div class="live">
            <span class="live-dot"></span>
            Live
        </div>
    </header>


    <!-- Learning Goal -->

    <section class="goal-section">

        <div class="eyebrow">WHAT DO YOU WANT TO LEARN?</div>

        <input
            id="goal-input"
            type="text"
            placeholder="e.g. How does the stock market work?"
        >

        <button id="generate-button">
            Generate learning map
        </button>

        <div id="loading" class="hidden">
            Building your learning path...
        </div>

    </section>


    <!-- Learning Map -->

    <section id="map-section" class="hidden">

        <div class="eyebrow">YOUR ROUTE</div>

        <div id="map"></div>
        <p id="move-note" class="hidden"></p>

    </section>

    <button id="map-button">
        Explore your map
    </button>


    <!-- Progress -->

    <section class="progress-section">

        <div class="eyebrow">YOUR JOURNEY</div>

        <div id="progress-list"></div>

        <div class="progress-meta">
            <div id="progress-count">0 / 0 concepts</div>
            <div id="progress-percent">0%</div>
        </div>

        <div class="progress-track">
            <div id="progress-fill"></div>
        </div>

    </section>


    <section class="maps-section">
        <div class="eyebrow">YOUR MAPS</div>
        <div id="saved-maps"></div>
    </section>


    <!-- Journey -->

    <div class="journey-header">
        <div class="eyebrow">CURRENT JOURNEY</div>
        <div id="page-count">0 pages</div>
    </div>


    <main id="history">
        Loading...
    </main>

    <button id="clear-button">
        Clear journey
    </button>


    <script src="lessons.js"></script>
    <script src="popup.js"></script>

</body>
</html>
