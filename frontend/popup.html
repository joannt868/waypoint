<!DOCTYPE html>
<html>
<head>
    <title>Waypoint</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <header>
        <div class="brand">
            <div class="brand-mark">W</div>

            <div>
                <div class="brand-name">Waypoint</div>
                <div class="brand-subtitle">Your path through the web</div>
            </div>
        </div>

        <div class="live">
            <span class="live-dot"></span>
            Live
        </div>
    </header>

    <div class="journey-header">
        <div class="eyebrow">CURRENT JOURNEY</div>
        <div id="page-count">0 pages</div>
    </div>

    <main id="history">
        Loading...
    </main>

    <footer>
        <button id="map-button">
            Explore your map
        </button>

        <button id="clear-button">
            Clear journey
        </button>
    </footer>

    <script src="popup.js"></script>

</body>
</html>
